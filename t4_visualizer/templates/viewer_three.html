<style>

  .overlay-wrap{position:absolute;left:8px;bottom:8px;width:min(32vw,440px);max-height:min(24vh,200px);display:none;flex-direction:column;border:1px solid #2b3f7d;border-radius:10px;overflow:hidden;background:linear-gradient(180deg,#0c1022 0%,#080c18 100%);box-shadow:0 8px 32px rgba(0,0,0,.45)}

  .metrics-title{position:absolute;left:8px;top:5px;z-index:1;font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#7a8bbf;pointer-events:none;text-shadow:0 0 12px rgba(110,168,255,.35)}
  .metrics-legend{position:absolute;right:8px;top:6px;z-index:1;font-size:9px;letter-spacing:.06em;color:#8a9bc4;pointer-events:none}

  #metricsCanvas{width:100%;height:100%;display:block}

  .eval-tag .t-lbl{font-weight:600}
  .eval-tag .t-uuid{opacity:.88;font-size:10px;color:#cfe0ff}
</style>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { ColladaLoader } from "three/addons/loaders/ColladaLoader.js";
import { CSS2DObject, CSS2DRenderer } from "three/addons/renderers/CSS2DRenderer.js";

const params = new URLSearchParams("__QS__");
const dataset = params.get("t4dataset_id");
const scenario = params.get("scenario_name");
const startFrame = Number(params.get("frame_index") || "0");
const version = params.get("version");
const qv = version ? `&version=${encodeURIComponent(version)}` : "";
const metaUrl = `/viewer/three/meta?t4dataset_id=${encodeURIComponent(dataset)}&scenario_name=${encodeURIComponent(scenario)}${qv}`;

/** GT/Pred from postMessage use center+size+yaw; dataset boxes use API corners. Extra yaw (rad) aligns typical eval exports with T4 ego (+x forward, +y left). Omit query param for +π/2; use `external_bbox_yaw_offset=0` if your JSON already matches T4. */
function getExternalBboxYawOffset(){
  if (!params.has("external_bbox_yaw_offset")) return Math.PI / 2;
  const n = Number(params.get("external_bbox_yaw_offset"));
  return Number.isFinite(n) ? n : Math.PI / 2;
}
/** Swap length↔width for center-based boxes (`external_bbox_swap_lw=1`) when exporter names dimensions opposite to T4. */
function getExternalBboxSwapLW(){
  const v = (params.get("external_bbox_swap_lw") || "").toLowerCase();
  return v === "1" || v === "true" || v === "yes";
}

const canvas = document.getElementById("canvas");
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x070b16, 90, 230);
const perspCamera = new THREE.PerspectiveCamera(74, 1, 0.1, 1000);
const orthoCamera = new THREE.OrthographicCamera(-20, 20, 20, -20, 0.1, 1000);
let camera = perspCamera;
camera.position.set(-12, -8, 4.5);
camera.up.set(0, 0, 1);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0,0,0); controls.update();
scene.add(new THREE.AmbientLight(0x8aa6ff, 0.7));
const dl = new THREE.DirectionalLight(0xffffff, 0.9); dl.position.set(12, -10, 30); scene.add(dl);
const grid = new THREE.GridHelper(180, 90, 0x2b3a6f, 0x1a2342);
grid.rotation.x = Math.PI / 2; // XY ground plane (z-up)
scene.add(grid);

const pointsGeom = new THREE.BufferGeometry();
const pointsMat = new THREE.PointsMaterial({size:0.08, vertexColors:true, transparent:true, opacity:0.95});
const pointsObj = new THREE.Points(pointsGeom, pointsMat);
scene.add(pointsObj);
const boxesGroup = new THREE.Group(); scene.add(boxesGroup);
const gtLayerGroup = new THREE.Group(); scene.add(gtLayerGroup);
const predLayerGroup = new THREE.Group(); scene.add(predLayerGroup);
const matchedLayerGroup = new THREE.Group(); scene.add(matchedLayerGroup);
const evalTagsGroup = new THREE.Group();
scene.add(evalTagsGroup);
const laneletGroup = new THREE.Group(); scene.add(laneletGroup);
const egoAxes = new THREE.AxesHelper(2.8); scene.add(egoAxes);
/** Ego vehicle root (base_link); mesh from sample_vehicle_description or wireframe fallback. */
const egoRoot = new THREE.Group();
scene.add(egoRoot);
const egoFallback = new THREE.Mesh(
  new THREE.BoxGeometry(4.6, 1.9, 1.6),
  new THREE.MeshBasicMaterial({
    color: 0x6ea8ff,
    wireframe: true,
    transparent: true,
    opacity: Number(document.getElementById("boxOpacity").value || "0.9"),
  })
);
egoFallback.position.set(0, 0, 0.8);
egoRoot.add(egoFallback);
const EGO_WHEEL_BASE = 2.79;
function applyEgoOpacity(opacity){
  const solid = opacity >= 0.9;
  egoRoot.traverse((o) => {
    if (!o.isMesh || !o.material) return;
    const mats = Array.isArray(o.material) ? o.material : [o.material];
    for (const m of mats) {
      if (!m) continue;
      m.transparent = !solid;
      m.opacity = solid ? 1 : opacity;
      if ("depthWrite" in m) m.depthWrite = true;
    }
  });
}
function loadEgoVehicleMesh(){
  const loader = new ColladaLoader();
  return new Promise((resolve, reject) => {
    loader.load(
      "/viewer/assets/vehicle-mesh/lexus.dae",
      (collada) => {
        const v0 = Number(document.getElementById("boxOpacity").value || "0.9");
        egoRoot.remove(egoFallback);
        egoFallback.geometry.dispose();
        egoFallback.material.dispose();
        const visual = new THREE.Group();
        visual.position.set(EGO_WHEEL_BASE * 0.5, 0, 0);
        const meshRoot = collada.scene;
        meshRoot.rotation.x = -Math.PI / 2;
        meshRoot.rotation.z = Math.PI;
        const solid = v0 >= 0.9;
        meshRoot.traverse((o) => {
          if (!o.isMesh || !o.material) return;
          const mats = Array.isArray(o.material) ? o.material : [o.material];
          for (const m of mats) {
            if (!m) continue;
            if (m.map) {
              m.map.colorSpace = THREE.SRGBColorSpace;
              if ("color" in m) m.color.setRGB(1, 1, 1);
            }
            m.transparent = !solid;
            m.opacity = solid ? 1 : v0;
            if ("depthWrite" in m) m.depthWrite = true;
            if ("envMapIntensity" in m) m.envMapIntensity = 1;
          }
        });
        visual.add(meshRoot);
        egoRoot.add(visual);
        applyEgoOpacity(v0);
        resolve();
      },
      undefined,
      (err) => reject(err || new Error("Collada load failed"))
    );
  });
}
const cache = new Map(); const MAX_CACHE = 28;
let totalFrames = 0; let playing = false; let frame = startFrame; let fps = 6;
let lastFrameTs = 0;
let followEgo = true;
let intensityGain = 1.0;
let overlayEnabled = false;
let overlayData = null;
let overlayTexture = null;
let overlayImageKey = "";
const overlayTextureCache = new Map();
let laneletEnabled = false;
let laneletLoaded = false;
let laneletBounds = null;
let laneletFrame = -1;
let externalLayers = { gt: [], pred: [], matched: [], gtPairs: [], predPairs: [] };
/** When set, eval GT/pred/matched layers are keyed by frame index (from parent postMessage). */
let bboxLayersByFrame = null;
/** Optional per-frame series from parent: `{ gt: number[], pred: number[], tpr: number[] }` (lengths ≥ totalFrames). */
let metricsSeriesOverride = null;

const overlayCanvas = document.getElementById("overlayCanvas");
const overlayRenderer = new THREE.WebGLRenderer({canvas: overlayCanvas, antialias:true, alpha:true});
overlayRenderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
overlayRenderer.outputColorSpace = THREE.SRGBColorSpace;
overlayRenderer.toneMapping = THREE.NoToneMapping;
const overlayScene = new THREE.Scene();
const overlayCamera3d = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 10);
overlayCamera3d.position.set(0,0,2);
const metricsCanvas = document.getElementById("metricsCanvas");
const metricsWrapEl = document.getElementById("metricsWrap");
const metricsScene = new THREE.Scene();
metricsScene.background = null;
const metricsCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 20);
metricsCamera.position.set(0, 0, 3);
const metricsRenderer = new THREE.WebGLRenderer({ canvas: metricsCanvas, antialias: true, alpha: true });
metricsRenderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
metricsRenderer.setClearColor(0x000000, 0);
metricsRenderer.outputColorSpace = THREE.SRGBColorSpace;
metricsRenderer.toneMapping = THREE.NoToneMapping;
let metricsChartGroup = new THREE.Group();
metricsScene.add(metricsChartGroup);
let metricsPlayhead = null;

const slider = document.getElementById("slider");
const frameTxt = document.getElementById("frameTxt");
const statusEl = document.getElementById("status");
const metaEl = document.getElementById("meta");
const evalHudEl = document.getElementById("evalHud");
const canvasWrapEl = document.getElementById("canvasWrap");
let css2dRenderer = null;
function ensureCss2dRenderer(){
  if (css2dRenderer || !canvasWrapEl) return;
  css2dRenderer = new CSS2DRenderer();
  css2dRenderer.domElement.style.position = "absolute";
  css2dRenderer.domElement.style.top = "0";
  css2dRenderer.domElement.style.left = "0";
  css2dRenderer.domElement.style.pointerEvents = "none";
  canvasWrapEl.appendChild(css2dRenderer.domElement);
}
function setStatus(t){ statusEl.textContent = t; }
function setFrameText(){ frameTxt.textContent = `frame ${frame}/${Math.max(0,totalFrames-1)}`; slider.value = String(frame); }

/** Update HUD block for GT/Pred/Matched when postMessage or per-frame eval data is present. */
function updateEvalHud(){
  if (!evalHudEl) return;
  const gt = Array.isArray(externalLayers.gt) ? externalLayers.gt.length : 0;
  const pred = Array.isArray(externalLayers.pred) ? externalLayers.pred.length : 0;
  const matched = Array.isArray(externalLayers.matched) ? externalLayers.matched.length : 0;
  const mapKeys = bboxLayersByFrame && typeof bboxLayersByFrame === "object"
    ? Object.keys(bboxLayersByFrame).length
    : 0;
  const hasFrameMap = mapKeys > 0;
  const hasAny = gt > 0 || pred > 0 || matched > 0 || hasFrameMap;
  if (!hasAny) {
    evalHudEl.hidden = true;
    evalHudEl.innerHTML = "";
    return;
  }
  evalHudEl.hidden = false;
  const mapLine = hasFrameMap
    ? `<div class="row" style="margin-top:.35rem;opacity:.92"><span>per-frame keys</span><span>${mapKeys}</span></div>`
    : "";
  evalHudEl.innerHTML =
    `<div style="font-weight:600;font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:.25rem">Eval layers (this frame)</div>` +
    `<div class="row"><span>GT</span><span class="nGt">${gt}</span></div>` +
    `<div class="row"><span>Pred</span><span class="nPr">${pred}</span></div>` +
    `<div class="row"><span>Matched</span><span class="nMt">${matched}</span></div>` +
    mapLine;
}
function syncFullscreenButton(){
  const btn = document.getElementById("toggleFullscreen");
  if (!btn) return;
  btn.textContent = document.fullscreenElement ? "Exit fullscreen" : "Fullscreen";
}

function resizeMainRenderer(){
  ensureCss2dRenderer();
  const wrap = document.getElementById("canvasWrap");
  const w = Math.max(1, (wrap && wrap.clientWidth) || canvas.clientWidth || window.innerWidth);
  const h = Math.max(1, (wrap && wrap.clientHeight) || canvas.clientHeight || (window.innerHeight - 64));
  renderer.setSize(w, h, false);
  if (css2dRenderer) css2dRenderer.setSize(w, h, false);
  if (camera.isPerspectiveCamera) {
    camera.aspect = w / h;
  } else {
    const fr = 22;
    camera.left = -fr * (w / h);
    camera.right = fr * (w / h);
    camera.top = fr;
    camera.bottom = -fr;
  }
  camera.updateProjectionMatrix();
  resizeMetricsRenderer();
}

function resizeMetricsRenderer(){
  if (!metricsWrapEl || !metricsCanvas || metricsWrapEl.hidden) return;
  const w = Math.max(120, metricsWrapEl.clientWidth || 280);
  const h = Math.max(80, metricsWrapEl.clientHeight || 120);
  metricsRenderer.setSize(w, h, false);
}

/** Derive GT / Pred / TPR series from override or per-frame bbox map. TPR ≈ matched_pairs / max(GT,1). */
function computeMetricsSeries(){
  const mo = metricsSeriesOverride;
  if (mo && typeof mo === "object" && (Array.isArray(mo.gt) || Array.isArray(mo.pred) || Array.isArray(mo.tpr))) {
    const gIn = Array.isArray(mo.gt) ? mo.gt : [];
    const pIn = Array.isArray(mo.pred) ? mo.pred : [];
    const tIn = mo.tpr;
    const gt = [];
    const pred = [];
    const tpr = [];
    for (let i = 0; i < totalFrames; i++) {
      gt.push(Number(gIn[i] || 0));
      pred.push(Number(pIn[i] || 0));
      if (Array.isArray(tIn) && i < tIn.length) tpr.push(Math.min(1, Number(tIn[i] || 0)));
      else {
        const g = gt[i];
        const p = pred[i];
        const tp = Math.min(g, p);
        tpr.push(g > 0 ? Math.min(1, tp / g) : 0);
      }
    }
    return { gt, pred, tpr, n: totalFrames };
  }
  if (!bboxLayersByFrame || totalFrames <= 0) return null;
  const gt = [];
  const pred = [];
  const tpr = [];
  for (let fi = 0; fi < totalFrames; fi++) {
    const sk = String(fi);
    const entry = Object.prototype.hasOwnProperty.call(bboxLayersByFrame, sk)
      ? bboxLayersByFrame[sk]
      : bboxLayersByFrame[fi];
    let g = 0;
    let p = 0;
    let pairs = 0;
    if (entry && typeof entry === "object") {
      g = Array.isArray(entry.gt) ? entry.gt.length : 0;
      p = Array.isArray(entry.pred) ? entry.pred.length : 0;
      pairs = Array.isArray(entry.matched_pairs) ? entry.matched_pairs.length : 0;
      if (!pairs && Array.isArray(entry.matched)) pairs = Math.max(0, Math.floor(entry.matched.length / 2));
    }
    gt.push(g);
    pred.push(p);
    tpr.push(Math.min(1, pairs / Math.max(g, 1)));
  }
  return { gt, pred, tpr, n: totalFrames };
}

function rebuildMetricsPlot(){
  while (metricsChartGroup.children.length) metricsChartGroup.remove(metricsChartGroup.children[0]);
  metricsPlayhead = null;
  const want = document.getElementById("showMetricsPlot") && document.getElementById("showMetricsPlot").checked;
  if (!metricsWrapEl || !want) {
    if (metricsWrapEl) metricsWrapEl.hidden = true;
    return;
  }
  const series = computeMetricsSeries();
  if (!series || series.n <= 0) {
    metricsWrapEl.hidden = true;
    return;
  }
  const { gt, pred, tpr, n } = series;
  let yMax = 1e-6;
  for (let i = 0; i < n; i++) {
    yMax = Math.max(yMax, gt[i], pred[i], 1);
  }
  const x0 = -0.9;
  const x1 = 0.9;
  const y0 = -0.78;
  const y1 = 0.78;
  const span = x1 - x0;

  const bg = new THREE.Mesh(
    new THREE.PlaneGeometry(2.05, 1.85),
    new THREE.MeshBasicMaterial({ color: 0x06091c, transparent: true, opacity: 0.92 })
  );
  bg.position.z = -0.02;
  metricsChartGroup.add(bg);

  const starPos = [];
  const starCol = [];
  for (let s = 0; s < 64; s++) {
    starPos.push((Math.random() - 0.5) * 2, (Math.random() - 0.5) * 1.6, -0.01);
    const tw = 0.35 + Math.random() * 0.65;
    starCol.push(0.45 * tw, 0.55 * tw, 0.95 * tw);
  }
  const starG = new THREE.BufferGeometry();
  starG.setAttribute("position", new THREE.Float32BufferAttribute(starPos, 3));
  starG.setAttribute("color", new THREE.Float32BufferAttribute(starCol, 3));
  metricsChartGroup.add(new THREE.Points(starG, new THREE.PointsMaterial({ size: 0.012, vertexColors: true, transparent: true, opacity: 0.5 })));

  for (let g = 0; g <= 4; g++) {
    const t = g / 4;
    const y = y0 + (y1 - y0) * t;
    const gg = new THREE.BufferGeometry();
    gg.setAttribute("position", new THREE.Float32BufferAttribute([x0, y, 0, x1, y, 0], 3));
    metricsChartGroup.add(new THREE.Line(gg, new THREE.LineBasicMaterial({ color: 0x2a3f60, transparent: true, opacity: 0.55 })));
  }

  function lineStrip(vals, color, isTpr){
    const pts = [];
    const denom = isTpr ? 1 : yMax;
    for (let i = 0; i < n; i++) {
      const xf = n <= 1 ? 0.5 : i / (n - 1);
      const x = x0 + span * xf;
      const v = isTpr ? Math.max(0, Math.min(1, vals[i])) : vals[i] / denom;
      const y = y0 + (y1 - y0) * Math.max(0, Math.min(1, v));
      pts.push(x, y, 0.02);
    }
    if (pts.length === 3) {
      pts.push(pts[0], pts[1], pts[2]);
    }
    const geom = new THREE.BufferGeometry();
    geom.setAttribute("position", new THREE.Float32BufferAttribute(pts, 3));
    return new THREE.Line(geom, new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0.95 }));
  }
  metricsChartGroup.add(lineStrip(gt, 0x4bd08d, false));
  metricsChartGroup.add(lineStrip(pred, 0xff5ec4, false));
  metricsChartGroup.add(lineStrip(tpr, 0xffcc66, true));

  const phGeom = new THREE.BufferGeometry();
  const phPos = new Float32Array([-0.9, -0.78, 0.04, -0.9, 0.78, 0.04]);
  phGeom.setAttribute("position", new THREE.BufferAttribute(phPos, 3));
  metricsPlayhead = new THREE.Group();
  metricsPlayhead.userData.geom = phGeom;
  metricsPlayhead.add(new THREE.Line(phGeom, new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 1 })));
  const phGeom2 = new THREE.BufferGeometry();
  const phPos2 = new Float32Array(phPos);
  phGeom2.setAttribute("position", new THREE.BufferAttribute(phPos2, 3));
  metricsPlayhead.userData.geomGlow = phGeom2;
  metricsPlayhead.add(new THREE.Line(phGeom2, new THREE.LineBasicMaterial({ color: 0x6ea8ff, transparent: true, opacity: 0.4 })));
  metricsChartGroup.add(metricsPlayhead);

  metricsWrapEl.hidden = false;
  resizeMetricsRenderer();
  updateMetricsPlayhead();
}

function updateMetricsPlayhead(){
  if (!metricsPlayhead || !metricsPlayhead.userData || metricsWrapEl.hidden) return;
  const series = computeMetricsSeries();
  if (!series || series.n <= 0) return;
  const n = series.n;
  const xf = n <= 1 ? 0.5 : frame / Math.max(n - 1, 1);
  const x0 = -0.9;
  const x1 = 0.9;
  const x = x0 + (x1 - x0) * xf;
  const y0 = -0.78;
  const y1 = 0.78;
  const g0 = metricsPlayhead.userData.geom;
  const g1 = metricsPlayhead.userData.geomGlow;
  if (g0 && g0.attributes.position) {
    const a = g0.attributes.position.array;
    a[0] = x; a[1] = y0; a[3] = x; a[4] = y1;
    g0.attributes.position.needsUpdate = true;
  }
  if (g1 && g1.attributes.position) {
    const b = g1.attributes.position.array;
    b[0] = x; b[1] = y0; b[3] = x; b[4] = y1;
    g1.attributes.position.needsUpdate = true;
  }
}

function shortCamLabel(name){
  const x = String(name || "").replace(/^CAM_?/i, "").replace(/_/g, " ").trim();
  return x.length > 16 ? `${x.slice(0, 14)}…` : x;
}

/** Map camera name to ring slot 0–5: front L, front, front R, back L, back, back R. */
function inferCameraSlot(camName){
  const s = String(camName || "").toLowerCase().replace(/[^a-z0-9]+/g, "");
  if (!s.length) return -1;
  const hasFront = s.includes("front");
  const hasBack = s.includes("back");
  const hasLeft = s.includes("left");
  const hasRight = s.includes("right");
  if (hasFront && hasLeft) return 0;
  if (hasFront && hasRight) return 2;
  if (hasBack && hasLeft) return 3;
  if (hasBack && hasRight) return 5;
  if (hasBack && !hasLeft && !hasRight) return 4;
  if (hasFront && !hasLeft && !hasRight) return 1;
  return -1;
}

/** Order multi-camera payloads into 2×3 grid; returns slots[6] with null gaps. */
function buildCameraSlots(rows){
  const slots = Array(6).fill(null);
  const extra = [];
  for (const p of rows) {
    const slot = inferCameraSlot(p.camera);
    if (slot >= 0 && !slots[slot]) slots[slot] = p;
    else extra.push(p);
  }
  for (const p of extra) {
    const empty = slots.findIndex((x) => x == null);
    if (empty >= 0) slots[empty] = p;
  }
  return slots;
}

function readFloat32Copied(buf, off, count){
  const bytes = new Uint8Array(buf, off, count * 4);
  const copied = new Uint8Array(bytes.length);
  copied.set(bytes);
  return new Float32Array(copied.buffer);
}

function parseFrameBuffer(buf){
  const dv = new DataView(buf);
  const magic = new TextDecoder().decode(new Uint8Array(buf, 0, 8));
  if (magic !== "T4V3D001" && magic !== "T4V3D002") throw new Error(`unexpected format ${magic}`);
  const frameIndex = dv.getUint32(12, true);
  const timestampUs = Number(dv.getBigUint64(16, true));
  const pointCount = dv.getUint32(24, true);
  const boxCount = dv.getUint32(28, true);
  const tokenLen = dv.getUint16(32, true);
  let off = 34;
  const sampleToken = new TextDecoder().decode(new Uint8Array(buf, off, tokenLen)); off += tokenLen;
  const pts = readFloat32Copied(buf, off, pointCount * 4); off += pointCount * 16;
  const boxStride = magic === "T4V3D002" ? 24 : 7;
  const boxes = readFloat32Copied(buf, off, boxCount * boxStride); off += boxCount * boxStride * 4;
  const labelLen = dv.getUint32(off, true); off += 4;
  const labels = JSON.parse(new TextDecoder().decode(new Uint8Array(buf, off, labelLen)));
  return { frameIndex, timestampUs, sampleToken, pointCount, boxCount, pts, boxes, labels, format: magic };
}

function clearGroup(g){
  while (g.children.length) g.remove(g.children[0]);
}

/**
 * Rotated box in ego frame (x forward, y left, z up), same as `visualize.py` TargetObject / `_project_bbox_to_roi`:
 * body-x = length (forward), body-y = width (lateral).
 */
function boxEdgesFromCenterWithOpts(box, opts){
  const yawOff = opts && Number.isFinite(opts.yawOffset) ? opts.yawOffset : 0;
  const swapLW = opts && opts.swapLW;
  const cx = Number(box.x ?? box.cx ?? 0);
  const cy = Number(box.y ?? box.cy ?? 0);
  const cz = Number(box.z ?? box.cz ?? 0);
  let l = Math.max(0.01, Number(box.length ?? box.l ?? 1.0));
  let w = Math.max(0.01, Number(box.width ?? box.w ?? 1.0));
  const h = Math.max(0.01, Number(box.height ?? box.h ?? 1.0));
  if (swapLW || box.swap_lw === true) {
    const t = l;
    l = w;
    w = t;
  }
  const yaw = Number(box.yaw ?? box.heading ?? 0.0) + yawOff;
  const hw = w / 2;
  const hl = l / 2;
  const hh = h / 2;
  const c = Math.cos(yaw);
  const s = Math.sin(yaw);
  const body = [
    [ hl,  hw,  hh], [ hl, -hw,  hh], [ hl, -hw, -hh], [ hl,  hw, -hh],
    [-hl,  hw,  hh], [-hl, -hw,  hh], [-hl, -hw, -hh], [-hl,  hw, -hh],
  ];
  const corners = body.map(([bx, by, bz]) => [cx + bx * c - by * s, cy + bx * s + by * c, cz + bz]);
  const edgePairs = [[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]];
  const out = [];
  for (const [a, b] of edgePairs){
    out.push(...corners[a], ...corners[b]);
  }
  return out;
}

/** PostMessage GT/Pred/Matched: apply T4 alignment offset and optional length/width swap (see URL params). */
function boxEdgesFromCenterExternal(box){
  return boxEdgesFromCenterWithOpts(box, {
    yawOffset: getExternalBboxYawOffset(),
    swapLW: getExternalBboxSwapLW(),
  });
}

function boxEdgesFromCorners(box){
  const arr = Array.isArray(box.corners) ? box.corners : [];
  if (arr.length !== 24) return null;
  const edges = [[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]];
  const out = [];
  for (const [a,b] of edges){
    const a0 = a * 3, b0 = b * 3;
    out.push(arr[a0], arr[a0+1], arr[a0+2], arr[b0], arr[b0+1], arr[b0+2]);
  }
  return out;
}

/** Aligns with common evaluator color_map: (GT|EST) × (TP|FN|FP). */
const EVAL_STATUS_COLOR_HEX = {
  "GT:TP": 0x00cc66,
  "GT:FN": 0xff9933,
  "EST:TP": 0x66b3ff,
  "EST:FP": 0xff6666,
};

function normalizeEvalKind(box, layerId){
  const raw = box.kind ?? box.eval_kind ?? box.role ?? box.source_kind;
  if (raw != null && String(raw).trim() !== "") {
    const u = String(raw).toUpperCase();
    if (u === "EST" || u === "PRED" || u === "PREDICTION" || u === "ESTIMATE" || u === "DET") return "EST";
    if (u === "GT" || u === "GROUNDTRUTH" || u === "GTRUTH") return "GT";
  }
  if (layerId === "pred") return "EST";
  if (layerId === "gt") return "GT";
  if (layerId === "matched") return "GT";
  return "GT";
}

function normalizeEvalStatus(box){
  const s = String(box.status ?? "TP").toUpperCase();
  if (s === "TP" || s === "FN" || s === "FP") return s;
  return "TP";
}

function evalLineColor(box, layerId){
  const kind = normalizeEvalKind(box, layerId);
  const st = normalizeEvalStatus(box);
  const key = `${kind}:${st}`;
  if (Object.prototype.hasOwnProperty.call(EVAL_STATUS_COLOR_HEX, key)) {
    return EVAL_STATUS_COLOR_HEX[key];
  }
  return layerId === "pred" ? 0xff5ec4 : layerId === "matched" ? 0x58d8ff : 0x4bd08d;
}

function boxAnchorForLabel(box){
  const arr = Array.isArray(box.corners) ? box.corners : null;
  if (arr && arr.length >= 24) {
    let maxz = -Infinity;
    let sx = 0;
    let sy = 0;
    for (let i = 0; i < 8; i++) {
      const x = arr[i * 3];
      const y = arr[i * 3 + 1];
      const z = arr[i * 3 + 2];
      sx += x;
      sy += y;
      maxz = Math.max(maxz, z);
    }
    sx /= 8;
    sy /= 8;
    return new THREE.Vector3(sx, sy, maxz + 0.25);
  }
  const cx = Number(box.x ?? box.cx ?? 0);
  const cy = Number(box.y ?? box.cy ?? 0);
  const cz = Number(box.z ?? box.cz ?? 0);
  const h = Math.max(0.01, Number(box.height ?? box.h ?? 1.0));
  const hh = h / 2;
  return new THREE.Vector3(cx, cy, cz + hh + 0.25);
}

function escHtml(s){
  const d = document.createElement("div");
  d.textContent = s == null ? "" : String(s);
  return d.innerHTML;
}

function shortUuid(u){
  const t = String(u || "");
  if (t.length <= 14) return t;
  return `${t.slice(0, 6)}…${t.slice(-4)}`;
}

function clearEvalTags(){
  while (evalTagsGroup.children.length) evalTagsGroup.remove(evalTagsGroup.children[0]);
}

function renderEvalTags(){
  clearEvalTags();
  const showL = document.getElementById("showEvalLabel") && document.getElementById("showEvalLabel").checked;
  const showU = document.getElementById("showEvalUuid") && document.getElementById("showEvalUuid").checked;
  if (!showL && !showU) return;
  const layers = [
    { id: "gt", key: "gt", arr: externalLayers.gt, vis: () => !!document.getElementById("showGtLayer").checked },
    { id: "pred", key: "pred", arr: externalLayers.pred, vis: () => !!document.getElementById("showPredLayer").checked },
    { id: "matched", key: "matched", arr: externalLayers.matched, vis: () => !!document.getElementById("showMatchedLayer").checked },
  ];
  for (const L of layers) {
    if (!L.vis()) continue;
    const list = Array.isArray(L.arr) ? L.arr : [];
    for (const b of list) {
      if (!b || typeof b !== "object") continue;
      const label = b.label != null && String(b.label).trim() !== "" ? String(b.label) : "";
      const uuid = b.uuid != null && String(b.uuid).trim() !== "" ? String(b.uuid) : "";
      const hasLabel = showL && label;
      const hasUuid = showU && uuid;
      if (!hasLabel && !hasUuid) continue;
      const div = document.createElement("div");
      div.className = "eval-tag";
      const bits = [];
      if (hasLabel) bits.push(`<span class="t-lbl">${escHtml(label)}</span>`);
      if (hasUuid) bits.push(`<span class="t-uuid">${escHtml(shortUuid(uuid))}</span>`);
      if (!bits.length) continue;
      div.innerHTML = bits.join("<br/>");
      const obj = new CSS2DObject(div);
      obj.position.copy(boxAnchorForLabel(b));
      evalTagsGroup.add(obj);
    }
  }
}

function drawLayerBoxes(group, boxes, layerId, width=1.4){
  clearGroup(group);
  if (!Array.isArray(boxes)) return;
  const opacity = Number(document.getElementById("boxOpacity").value || "0.9");
  for (const b of boxes){
    const edges = boxEdgesFromCorners(b) || boxEdgesFromCenterExternal(b);
    const g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.Float32BufferAttribute(edges, 3));
    const col = evalLineColor(b, layerId);
    const m = new THREE.LineBasicMaterial({ color: col, transparent: true, opacity });
    const seg = new THREE.LineSegments(g, m);
    seg.userData.lineWidth = width;
    group.add(seg);
  }
}

function renderExternalLayers(){
  drawLayerBoxes(gtLayerGroup, externalLayers.gt, "gt", 1.2);
  drawLayerBoxes(predLayerGroup, externalLayers.pred, "pred", 1.2);
  drawLayerBoxes(matchedLayerGroup, externalLayers.matched, "matched", 1.8);
  gtLayerGroup.visible = !!document.getElementById("showGtLayer").checked;
  predLayerGroup.visible = !!document.getElementById("showPredLayer").checked;
  matchedLayerGroup.visible = !!document.getElementById("showMatchedLayer").checked;
  renderEvalTags();
}

function setExternalLayerPayload(payload, opts){
  const doAck = !opts || opts.ack !== false;
  const gt = Array.isArray(payload.gt) ? payload.gt : [];
  const pred = Array.isArray(payload.pred) ? payload.pred : [];
  let matched = Array.isArray(payload.matched) ? payload.matched : [];
  const pairs = Array.isArray(payload.matched_pairs) ? payload.matched_pairs : [];
  if (!matched.length && pairs.length){
    matched = [];
    for (const p of pairs){
      const gi = Number(p.gt_idx);
      const pi = Number(p.pred_idx);
      if (Number.isFinite(gi) && gt[gi]) matched.push(gt[gi]);
      if (Number.isFinite(pi) && pred[pi]) matched.push(pred[pi]);
    }
  }
  externalLayers = { gt, pred, matched };
  renderExternalLayers();
  updateEvalHud();
  setStatus(`ready · cached=${cache.size} · ext(gt=${gt.length},pred=${pred.length},match=${matched.length})`);
  if (!doAck) return;
  const ack = `/viewer/three/debug/message-received?t4dataset_id=${encodeURIComponent(dataset)}&scenario_name=${encodeURIComponent(scenario)}&frame_index=${frame}&gt_count=${gt.length}&pred_count=${pred.length}&matched_count=${matched.length}`;
  fetch(ack)
    .then((r) => {
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      return r.json();
    })
    .then((body) => {
      console.info("[viewer-debug] bbox_layers ack ok", body);
    })
    .catch((err) => {
      console.warn("[viewer-debug] bbox_layers ack failed", err);
    });
}

/** Apply eval parquet layers for frame index *i* when bboxLayersByFrame is set (parent sent bbox_layers_by_frame). */
function applyEvalLayersForFrame(i){
  if (!bboxLayersByFrame) return;
  const sk = String(i);
  const entry = Object.prototype.hasOwnProperty.call(bboxLayersByFrame, sk)
    ? bboxLayersByFrame[sk]
    : bboxLayersByFrame[i];
  if (entry && typeof entry === "object"){
    setExternalLayerPayload(entry, { ack: false });
  } else {
    externalLayers = { gt: [], pred: [], matched: [] };
    renderExternalLayers();
    updateEvalHud();
    setStatus(`ready · cached=${cache.size} · ext(gt=0,pred=0,match=0)`);
  }
}

async function fetchFrame(i){
  if (cache.has(i)) return cache.get(i);
  const url = `/viewer/three/frame.bin?t4dataset_id=${encodeURIComponent(dataset)}&scenario_name=${encodeURIComponent(scenario)}&frame_index=${i}${qv}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error(`frame ${i}: HTTP ${res.status}`);
  const parsed = parseFrameBuffer(await res.arrayBuffer());
  cache.set(i, parsed);
  if (cache.size > MAX_CACHE) {
    const k = cache.keys().next().value;
    cache.delete(k);
  }
  return parsed;
}

async function loadLanelet(){
  if (laneletLoaded && laneletFrame === frame) return;
  setStatus("loading lanelet...");
  const url = `/viewer/three/lanelet-lines?t4dataset_id=${encodeURIComponent(dataset)}&scenario_name=${encodeURIComponent(scenario)}&frame_index=${frame}${qv}&max_segments=90000&clip_radius_m=170`;
  const res = await fetch(url);
  if (!res.ok) throw new Error(`lanelet HTTP ${res.status}`);
  const data = await res.json();
  if (!data.available) {
    setStatus(`lanelet unavailable: ${data.reason || "not found"}`);
    laneletLoaded = true;
    return;
  }
  const segs = Array.isArray(data.segments) ? data.segments : [];
  const roleColors = { left: 0x4bd08d, right: 0xff8f5a, centerline: 0x7aa7ff, unknown: 0xd0d7ff };
  const byRole = { left: [], right: [], centerline: [], unknown: [] };
  let xmin=Infinity, xmax=-Infinity, ymin=Infinity, ymax=-Infinity;
  for (const s of segs){
    const role = byRole[s.role] ? s.role : "unknown";
    byRole[role].push(s.x0, s.y0, s.z0 || 0, s.x1, s.y1, s.z1 || 0);
    xmin = Math.min(xmin, s.x0, s.x1); xmax = Math.max(xmax, s.x0, s.x1);
    ymin = Math.min(ymin, s.y0, s.y1); ymax = Math.max(ymax, s.y0, s.y1);
  }
  laneletBounds = isFinite(xmin) ? { xmin, xmax, ymin, ymax } : null;
  while (laneletGroup.children.length) laneletGroup.remove(laneletGroup.children[0]);
  for (const role of Object.keys(byRole)){
    const arr = byRole[role];
    if (!arr.length) continue;
    const g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.Float32BufferAttribute(arr, 3));
    const m = new THREE.LineBasicMaterial({ color: roleColors[role], transparent: true, opacity: role === "centerline" ? 0.95 : 0.78 });
    laneletGroup.add(new THREE.LineSegments(g, m));
  }
  laneletGroup.visible = laneletEnabled;
  laneletLoaded = true;
  laneletFrame = frame;
  setStatus(`lanelet loaded: ${segs.length} segments`);
}

function renderCameraOverlay(payload){
  overlayData = payload;
  if (!overlayEnabled) return;
  const wrap = document.getElementById("overlayWrap");
  const inner = wrap && wrap.querySelector ? wrap.querySelector(".overlay-canvas-inner") : null;
  const rowTop = document.getElementById("overlayLabelRowTop");
  const rowBot = document.getElementById("overlayLabelRowBottom");
  if (!wrap) return;
  const selected = (document.getElementById("overlayCamera") || {value:""}).value;
  const allMode = selected === "__ALL__";
  if (rowTop && rowBot) {
    if (allMode && Array.isArray(payload.cameras_payload) && payload.cameras_payload.length > 1) {
      rowTop.style.display = "flex";
      rowBot.style.display = "flex";
    } else {
      rowTop.style.display = "none";
      rowBot.style.display = "none";
      rowTop.innerHTML = "";
      rowBot.innerHTML = "";
    }
  }
  overlayCanvas.style.display = "block";
  const w = Math.max(80, (inner && inner.clientWidth) || wrap.clientWidth || 320);
  const h = Math.max(72, (inner && inner.clientHeight) || Math.floor(w * 0.35));
  overlayRenderer.setSize(w, h, false);
  while (overlayScene.children.length) overlayScene.remove(overlayScene.children[0]);
  let rows = allMode
    ? (Array.isArray(payload.cameras_payload) ? payload.cameras_payload : [payload])
    : [payload];
  if (allMode && Array.isArray(payload.cameras_payload) && payload.cameras_payload.length > 1) {
    const slots = buildCameraSlots(rows);
    rows = slots;
    if (rowTop && rowBot) {
      rowTop.innerHTML = [0, 1, 2].map((i) => `<span title="${slots[i] && slots[i].camera ? slots[i].camera : ""}">${slots[i] ? shortCamLabel(slots[i].camera) : "—"}</span>`).join("");
      rowBot.innerHTML = [3, 4, 5].map((i) => `<span title="${slots[i] && slots[i].camera ? slots[i].camera : ""}">${slots[i] ? shortCamLabel(slots[i].camera) : "—"}</span>`).join("");
    }
    const cols = 3;
    const nrows = 2;
    const tileW = 2 / cols;
    const tileH = 2 / nrows;
    for (let slot = 0; slot < 6; slot++) {
      const p = slots[slot];
      if (!p) continue;
      const r = slot < 3 ? 0 : 1;
      const c = slot % 3;
      const cx = -1 + tileW * c + tileW / 2;
      const cy = 1 - tileH * r - tileH / 2;
      const iw = Math.max(1, Number(p.width || 1));
      const ih = Math.max(1, Number(p.height || 1));
      const imgAspect = iw / ih;
      const tileAspect = (w * tileW / 2) / (h * tileH / 2);
      let sx = tileW;
      let sy = tileH;
      if (imgAspect > tileAspect) sy = tileW / imgAspect;
      else sx = tileH * imgAspect;
      const key = `${p.sample_token || payload.sample_token || ""}:${p.camera || ""}:${p.image_format || ""}:${(p.image_base64 || "").length}`;
      let tex = overlayTextureCache.get(key);
      if (!tex) {
        const img = new Image();
        img.src = `data:${p.image_format === "png" ? "image/png" : "image/jpeg"};base64,${p.image_base64 || ""}`;
        tex = new THREE.Texture(img);
        tex.colorSpace = THREE.SRGBColorSpace;
        tex.needsUpdate = true;
        overlayTextureCache.set(key, tex);
        if (overlayTextureCache.size > 24) {
          const first = overlayTextureCache.keys().next().value;
          const old = overlayTextureCache.get(first);
          if (old) old.dispose();
          overlayTextureCache.delete(first);
        }
      }
      const plane = new THREE.Mesh(
        new THREE.PlaneGeometry(sx, sy),
        new THREE.MeshBasicMaterial({ map: tex, color: 0xffffff, toneMapped: false })
      );
      plane.position.set(cx, cy, 0);
      overlayScene.add(plane);
      const annEl = document.getElementById("showOverlayAnnotations");
      if (annEl && annEl.checked) {
        const bxs = Array.isArray(p.boxes_2d) ? p.boxes_2d : [];
        for (const b of bxs) {
          const nx0 = ((b.x0 / iw) - 0.5) * sx + cx;
          const nx1 = ((b.x1 / iw) - 0.5) * sx + cx;
          const ny0 = (0.5 - (b.y0 / ih)) * sy + cy;
          const ny1 = (0.5 - (b.y1 / ih)) * sy + cy;
          const pts = [nx0, ny0, 0, nx1, ny0, 0, nx1, ny1, 0, nx0, ny1, 0, nx0, ny0, 0];
          const g = new THREE.BufferGeometry();
          g.setAttribute("position", new THREE.Float32BufferAttribute(pts, 3));
          overlayScene.add(new THREE.Line(g, new THREE.LineBasicMaterial({ color: 0xff5ec4, transparent: true, opacity: 0.95 })));
        }
      }
    }
  } else {
    const n = Math.max(1, rows.length);
    const cols = Math.ceil(Math.sqrt(n));
    const tileW = 2 / cols;
    const tileH = 2 / cols;
    for (let i = 0; i < rows.length; i++) {
      const p = rows[i];
      if (!p) continue;
      const r = Math.floor(i / cols);
      const c = i % cols;
      const cx = -1 + tileW * c + tileW / 2;
      const cy = 1 - tileH * r - tileH / 2;
      const iw = Math.max(1, Number(p.width || 1));
      const ih = Math.max(1, Number(p.height || 1));
      const imgAspect = iw / ih;
      const tileAspect = (w * tileW / 2) / (h * tileH / 2);
      let sx = tileW;
      let sy = tileH;
      if (imgAspect > tileAspect) sy = tileW / imgAspect;
      else sx = tileH * imgAspect;
      const key = `${p.sample_token || payload.sample_token || ""}:${p.camera || ""}:${p.image_format || ""}:${(p.image_base64 || "").length}`;
      let tex = overlayTextureCache.get(key);
      if (!tex) {
        const img = new Image();
        img.src = `data:${p.image_format === "png" ? "image/png" : "image/jpeg"};base64,${p.image_base64 || ""}`;
        tex = new THREE.Texture(img);
        tex.colorSpace = THREE.SRGBColorSpace;
        tex.needsUpdate = true;
        overlayTextureCache.set(key, tex);
        if (overlayTextureCache.size > 24) {
          const first = overlayTextureCache.keys().next().value;
          const old = overlayTextureCache.get(first);
          if (old) old.dispose();
          overlayTextureCache.delete(first);
        }
      }
      const plane = new THREE.Mesh(
        new THREE.PlaneGeometry(sx, sy),
        new THREE.MeshBasicMaterial({ map: tex, color: 0xffffff, toneMapped: false })
      );
      plane.position.set(cx, cy, 0);
      overlayScene.add(plane);
      const annEl = document.getElementById("showOverlayAnnotations");
      if (annEl && annEl.checked) {
        const bxs = Array.isArray(p.boxes_2d) ? p.boxes_2d : [];
        for (const b of bxs) {
          const nx0 = ((b.x0 / iw) - 0.5) * sx + cx;
          const nx1 = ((b.x1 / iw) - 0.5) * sx + cx;
          const ny0 = (0.5 - (b.y0 / ih)) * sy + cy;
          const ny1 = (0.5 - (b.y1 / ih)) * sy + cy;
          const pts = [nx0, ny0, 0, nx1, ny0, 0, nx1, ny1, 0, nx0, ny1, 0, nx0, ny0, 0];
          const g = new THREE.BufferGeometry();
          g.setAttribute("position", new THREE.Float32BufferAttribute(pts, 3));
          overlayScene.add(new THREE.Line(g, new THREE.LineBasicMaterial({ color: 0xff5ec4, transparent: true, opacity: 0.95 })));
        }
      }
    }
  }
  overlayRenderer.render(overlayScene, overlayCamera3d);
}

async function prefetchAround(i){
  const tasks = [];
  for (let d = 1; d <= 3; d++) {
    for (const j of [i + d, i - d]) {
      if (j >= 0 && j < totalFrames && !cache.has(j)) {
        tasks.push(fetchFrame(j).catch(() => null));
      }
    }
  }
  await Promise.all(tasks);
}

function setFrameData(data){
  const pos = new Float32Array(data.pointCount * 3);
  const col = new Float32Array(data.pointCount * 3);
  for (let i=0;i<data.pointCount;i++) {
    const x = data.pts[i*4], y=data.pts[i*4+1], z=data.pts[i*4+2], inten=data.pts[i*4+3];
    pos[i*3]=x; pos[i*3+1]=y; pos[i*3+2]=z;
    const t = Math.max(0, Math.min(1, inten * intensityGain));
    col[i*3]=0.15+0.85*t; col[i*3+1]=0.35+0.5*(1-t); col[i*3+2]=1.0-0.6*t;
  }
  pointsGeom.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  pointsGeom.setAttribute("color", new THREE.BufferAttribute(col, 3));
  pointsGeom.computeBoundingSphere();
  while (boxesGroup.children.length) boxesGroup.remove(boxesGroup.children[0]);
  const edges = [
    [0,1],[1,2],[2,3],[3,0],
    [4,5],[5,6],[6,7],[7,4],
    [0,4],[1,5],[2,6],[3,7]
  ];
  for (let i=0;i<data.boxCount;i++) {
    if (data.format === "T4V3D002") {
      const base = i * 24;
      const linePts = [];
      for (const [a,b] of edges) {
        const a0 = base + a * 3;
        const b0 = base + b * 3;
        linePts.push(
          data.boxes[a0], data.boxes[a0 + 1], data.boxes[a0 + 2],
          data.boxes[b0], data.boxes[b0 + 1], data.boxes[b0 + 2]
        );
      }
      const g = new THREE.BufferGeometry();
      g.setAttribute("position", new THREE.Float32BufferAttribute(linePts, 3));
      const m = new THREE.LineBasicMaterial({
        color:0xffd166, transparent:true,
        opacity:Number(document.getElementById("boxOpacity").value || "0.9")
      });
      const lines = new THREE.LineSegments(g, m);
      boxesGroup.add(lines);
    } else {
      const cx=data.boxes[i*7], cy=data.boxes[i*7+1], cz=data.boxes[i*7+2];
      const sx=data.boxes[i*7+3], sy=data.boxes[i*7+4], sz=data.boxes[i*7+5], yaw=data.boxes[i*7+6];
      const g = new THREE.BoxGeometry(sx, sy, sz);
      const m = new THREE.MeshBasicMaterial({color:0xffd166, wireframe:true, transparent:true, opacity:Number(document.getElementById("boxOpacity").value || "0.9")});
      const box = new THREE.Mesh(g, m);
      box.position.set(cx, cy, cz);
      box.rotation.set(0, 0, yaw);
      boxesGroup.add(box);
    }
  }
  const ann3d = document.getElementById("show3dAnnotations");
  boxesGroup.visible = !ann3d || !!ann3d.checked;
  metaEl.innerHTML = `<div>sample=<code>${data.sampleToken}</code></div><div>timestamp_us=${data.timestampUs}</div><div>points=${data.pointCount} boxes=${data.boxCount}</div>`;
}

async function showFrame(i){
  frame = Math.max(0, Math.min(totalFrames-1, i));
  setFrameText();
  setStatus(`loading frame ${frame} ...`);
  const data = await fetchFrame(frame);
  setFrameData(data);
  if (followEgo) {
    controls.target.set(0, 0, 0);
    controls.update();
  }
  if (overlayEnabled) {
    const payload = await fetchCameraOverlay(frame);
    if (payload) {
      ensureOverlayCameraOptions(payload);
      renderCameraOverlay(payload);
    }
  }
  if (laneletEnabled) {
    await loadLanelet();
    laneletGroup.visible = true;
  }
  prefetchAround(frame);
  if (bboxLayersByFrame) {
    applyEvalLayersForFrame(frame);
  } else {
    updateEvalHud();
    setStatus(`ready · cached=${cache.size}`);
  }
  updateMetricsPlayhead();
}

function applyOpacityToLineGroup(grp, v){
  for (const child of grp.children) {
    if (child.material) child.material.opacity = v;
  }
}
document.getElementById("boxOpacity").addEventListener("input", () => {

  for (const child of boxesGroup.children) {
    if (child.material) child.material.opacity = v;
  }
  applyOpacityToLineGroup(gtLayerGroup, v);
  applyOpacityToLineGroup(predLayerGroup, v);
  applyOpacityToLineGroup(matchedLayerGroup, v);

document.getElementById("projMode").addEventListener("click", () => {
  const wasPersp = camera === perspCamera;
  const next = wasPersp ? orthoCamera : perspCamera;
  next.position.copy(camera.position);
  next.up.set(0, 0, 1);
  if (wasPersp) {
    const fr = 22;
    orthoCamera.left = -fr; orthoCamera.right = fr; orthoCamera.top = fr; orthoCamera.bottom = -fr;
    orthoCamera.updateProjectionMatrix();
    document.getElementById("projMode").textContent = "orthographic";
  } else {
    perspCamera.fov = 74;
    perspCamera.updateProjectionMatrix();
    document.getElementById("projMode").textContent = "perspective";
  }
  controls.object = next;
  camera = next;
  controls.update();
});
window.addEventListener("message", (ev) => {
  const d = ev && ev.data ? ev.data : null;
  if (!d || typeof d !== "object") return;
  console.info("[viewer-debug] message received", { type: d.type, origin: ev.origin || "null" });
  if (d.type === "bbox_layers") {
    bboxLayersByFrame = null;
    setExternalLayerPayload(d);
  } else if (d.type === "bbox_layers_by_frame") {
    const frames = d.frames;
    if (frames && typeof frames === "object"){
      bboxLayersByFrame = frames;
      const n = Object.keys(frames).length;
      const ack = `/viewer/three/debug/message-received?t4dataset_id=${encodeURIComponent(dataset)}&scenario_name=${encodeURIComponent(scenario)}&frame_index=${frame}&gt_count=0&pred_count=0&matched_count=0&message_type=bbox_layers_by_frame&frames_count=${n}`;
      fetch(ack)
        .then((r) => r.ok ? r.json() : Promise.reject(new Error(String(r.status))))
        .then((body) => console.info("[viewer-debug] bbox_layers_by_frame ack ok", body))
        .catch((err) => console.warn("[viewer-debug] bbox_layers_by_frame ack failed", err));
      applyEvalLayersForFrame(frame);
      rebuildMetricsPlot();
    }
  } else if (d.type === "eval_metrics_series") {
    metricsSeriesOverride = {
      gt: Array.isArray(d.gt) ? d.gt : [],
      pred: Array.isArray(d.pred) ? d.pred : [],
      tpr: Array.isArray(d.tpr) ? d.tpr : null,
    };
    rebuildMetricsPlot();
  } else if (d.type === "bbox_layers_clear") {
    bboxLayersByFrame = null;
    metricsSeriesOverride = null;
    externalLayers = { gt: [], pred: [], matched: [] };
    renderExternalLayers();
    updateEvalHud();
    rebuildMetricsPlot();
  }
});
window.T4ViewerAPI = {
  setLayers(payload){ bboxLayersByFrame = null; setExternalLayerPayload(payload || {}); },
  clearLayers(){ bboxLayersByFrame = null; externalLayers = { gt: [], pred: [], matched: [] }; renderExternalLayers(); updateEvalHud(); rebuildMetricsPlot(); },
  setMetricsSeries(obj){
    if (!obj || typeof obj !== "object") return;
    metricsSeriesOverride = {
      gt: Array.isArray(obj.gt) ? obj.gt : [],
      pred: Array.isArray(obj.pred) ? obj.pred : [],
      tpr: Array.isArray(obj.tpr) ? obj.tpr : null,
    };
    rebuildMetricsPlot();
  },
  clearMetricsSeries(){ metricsSeriesOverride = null; rebuildMetricsPlot(); },
  getFrameContext(){ return { dataset, scenario, frame, totalFrames }; },
};

function animate(ts){
  requestAnimationFrame(animate);
  if (playing && totalFrames > 0 && ts - lastFrameTs > (1000 / Math.max(1, fps))) {
    lastFrameTs = ts;
    const nxt = frame + 1 >= totalFrames ? 0 : frame + 1;
    showFrame(nxt).catch((err) => setStatus(`error: ${err.message}`));
  }
  controls.update();
  renderer.render(scene, camera);
  if (css2dRenderer) css2dRenderer.render(scene, camera);
  if (overlayEnabled && overlayData) overlayRenderer.render(overlayScene, overlayCamera3d);
  const mchk = document.getElementById("showMetricsPlot");
  if (mchk && mchk.checked && metricsWrapEl && !metricsWrapEl.hidden && metricsChartGroup.children.length) {
    metricsRenderer.render(metricsScene, metricsCamera);
  }
}

(async function boot(){
  setStatus("bootstrapping...");
  const egoMeshPromise = loadEgoVehicleMesh().catch((err) => {
    console.warn("[viewer] ego vehicle mesh unavailable, using box fallback", err);
  });
  const metaRes = await fetch(metaUrl);
  if (!metaRes.ok) throw new Error(`meta HTTP ${metaRes.status}`);
  const meta = await metaRes.json();
  totalFrames = Number(meta.total_frames || 0);
  slider.max = String(Math.max(0, totalFrames - 1));
  camera = perspCamera;
  document.getElementById("projMode").textContent = "perspective";
  camera.position.set(-10, -2, 3.8);
  controls.target.set(0,0,0);
  controls.update();
  // Defer first size sync to next frame so layout is stable.
  requestAnimationFrame(() => resizeMainRenderer());
  setTimeout(() => resizeMainRenderer(), 0);
  await showFrame(Math.min(startFrame, Math.max(0, totalFrames - 1)));
  rebuildMetricsPlot();
  egoMeshPromise.catch(() => {});
  animate(0);
})().catch((err) => {
  setStatus(`boot error: ${err.message}`);
});
